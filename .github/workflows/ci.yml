name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest, SQLite)
        run: pytest

  postgres:
    # the same API tests against a real PostgreSQL (row locking, JSON columns, time zones)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: findoc
          POSTGRES_PASSWORD: findoc
          POSTGRES_DB: findoc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U findoc" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api]"
      - name: API tests on PostgreSQL
        env:
          FINDOC_TEST_DATABASE_URL: postgresql+psycopg://findoc:findoc@localhost:5432/findoc_test
        run: pytest tests/test_api.py --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (API, no OCR)
        run: docker build -t findoc-guard:ci .
      - name: Smoke test
        run: |
          docker run --rm findoc-guard:ci version
          docker run -d --name api -p 8000:8000 -e FINDOC_API_DATABASE_URL=sqlite:////data/ci.db \
            findoc-guard:ci api serve --host 0.0.0.0
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q '<div id="root">'
          docker logs api
